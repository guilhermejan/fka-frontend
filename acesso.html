<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - FKA Imports</title>
<link rel="stylesheet" href="./css/admin.css">
<style>
  .login-page {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .login-box {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 32px;
    width: 100%;
    max-width: 380px;
  }
  .login-box .brand {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 24px;
  }
  .login-box .brand img {
    height: 32px;
  }
  .login-box .brand h1 {
    font-size: 18px;
    font-weight: 600;
  }
  .login-box .brand h1 span {
    color: var(--gold);
  }
  .login-box label {
    display: block;
    font-size: 12px;
    color: var(--text-dim);
    margin-bottom: 14px;
  }
  .login-box input {
    display: block;
    width: 100%;
    margin-top: 6px;
    background: var(--bg-panel);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 10px 12px;
    color: var(--text);
    font-size: 13px;
  }
  .login-box input:focus {
    outline: 2px solid var(--gold);
    border-color: var(--gold);
  }
  .login-box .btn-primary {
    width: 100%;
    padding: 12px;
    margin-top: 8px;
  }
  .login-error {
    color: var(--red);
    font-size: 13px;
    margin-bottom: 14px;
    display: none;
  }
  .login-error.show {
    display: block;
  }
</style>
</head>
<body>

<div class="login-page">
  <div class="login-box">
    <div class="brand">
      <img src="./assets/images/logo.png" alt="FKA">
      <h1>FKA <span>Admin</span></h1>
    </div>

    <p class="login-error" id="login-error"></p>

    <form id="login-form">
      <label>Usuário
        <input type="text" id="username" required autocomplete="username">
      </label>
      <label>Senha
        <input type="password" id="password" required autocomplete="current-password">
      </label>
      <button type="submit" class="btn-primary">Entrar</button>
    </form>
  </div>
</div>

<script src="./js/api.js"></script>
<script>
  document.getElementById("login-form").addEventListener("submit", async (e) => {
    e.preventDefault();

    const username = document.getElementById("username").value.trim();
    const password = document.getElementById("password").value;
    const errorBox = document.getElementById("login-error");
    errorBox.classList.remove("show");

    try {
      const response = await fetch(`${API_URL}/auth/login`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ username, password })
      });

      const data = await response.json();

      if (!response.ok || !data.token) {
        errorBox.textContent = data.error || "Usuário ou senha inválidos.";
        errorBox.classList.add("show");
        return;
      }

      localStorage.setItem("token", data.token);
      window.location.href = "./fecca.html";

    } catch (error) {
      console.error(error);
      errorBox.textContent = "Erro de conexão com o servidor.";
      errorBox.classList.add("show");
    }
  });
</script>
</body>
</html>
